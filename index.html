<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" type="image/jpeg" href="/favicon.jpg" />
        <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fafafa" />
        <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000" />
        <meta name="color-scheme" content="light dark" />

        <title>Alikhan Ikhlassov — Software Engineer</title>
        <meta
            name="description"
            content="Official website of Alikhan Ikhlassov, a software engineer and systems builder from Atyrau, Kazakhstan."
        />

        <meta property="og:title" content="Alikhan Ikhlassov — Software Engineer" />
        <meta
            property="og:description"
            content="Software engineer and systems builder from Atyrau, Kazakhstan."
        />
        <meta property="og:type" content="website" />

        <!-- Theme initialization before paint to prevent flashing -->
        <script>
            (function () {
                try {
                    var t = localStorage.getItem("theme");
                    if (t !== "light" && t !== "dark") {
                        t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
                    }
                    document.documentElement.classList.toggle("dark", t === "dark");
                } catch (e) {}
            })();
        </script>
    </head>

    <body class="min-h-screen antialiased">
        <div id="root"></div>
        <script type="module" src="/src/main.jsx"></script>
    </body>
</html>
